name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testy jednostkowe
        run: python -m unittest discover -s tests -v

      - name: Smoke test silnika (tryb mock, bez sieci)
        run: python scripts/research.py --mock --out-dir "${{ runner.temp }}/a50-raw"

      - name: Smoke test budowy strony (dane testowe)
        run: |
          python - <<'EOF'
          import json, os
          dst = os.path.join(os.environ["RUNNER_TEMP"], "a50-fixture")
          os.makedirs(dst, exist_ok=True)
          entries = [{"date": "2026-09-01",
                      "scores": {
                          "north": {"score": 30, "confidence": "niska",
                                    "summary": "fixture", "trend_vs_prev": 0,
                                    "rationale": "r", "key_findings": []},
                          "south": {"score": 20, "confidence": "niska",
                                    "summary": "fixture", "trend_vs_prev": 0,
                                    "rationale": "r", "key_findings": []}},
                      "evidence": [], "sources_found": 0,
                      "engine_status": "no-data", "assessment_path": ""}]
          with open(os.path.join(dst, "scores.json"), "w", encoding="utf-8") as f:
              json.dump({"entries": entries}, f, ensure_ascii=False)
          EOF
          python scripts/build_site.py --scores "${{ runner.temp }}/a50-fixture/scores.json" --out "${{ runner.temp }}/a50-site"
